<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AH Task Pay</title>
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07266E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Default to dark mode unless light explicitly saved
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark { background-color: #0B1120; color: #f8fafc; }
      html { background-color: #F8FAFC; color: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
